name: Build CMDO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# IMPORTANT: Workflow ko write permission do
permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M1/M2/M3/M4)
          - os: macos-latest
            goos: darwin
            goarch: arm64
            name: cmdo-macos-arm64
            cgo: 1
            cc: ''
          
          # macOS Intel
          - os: macos-latest
            goos: darwin
            goarch: amd64
            name: cmdo-macos-amd64
            cgo: 1
            cc: ''
          
          # Windows 64-bit
          - os: windows-latest
            goos: windows
            goarch: amd64
            name: cmdo-windows-amd64.exe
            cgo: 1
            cc: ''
          
          # Windows 32-bit (Ubuntu se cross-compile)
          - os: ubuntu-latest
            goos: windows
            goarch: 386
            name: cmdo-windows-386.exe
            cgo: 1
            cc: 'i686-w64-mingw32-gcc'
          
          # Linux 64-bit (AMD64)
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            name: cmdo-linux-amd64
            cgo: 1
            cc: ''
          
          # Linux 32-bit (386)
          - os: ubuntu-latest
            goos: linux
            goarch: 386
            name: cmdo-linux-386
            cgo: 1
            cc: 'gcc -m32'
          
          # Linux ARM64 (Raspberry Pi 4, AWS Graviton, etc.)
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            name: cmdo-linux-arm64
            cgo: 1
            cc: 'aarch64-linux-gnu-gcc'
          
          # Linux ARM (Raspberry Pi 3 aur older)
          - os: ubuntu-latest
            goos: linux
            goarch: arm
            name: cmdo-linux-arm
            cgo: 1
            cc: 'arm-linux-gnueabihf-gcc'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      # Windows 32-bit ke liye MinGW setup (Ubuntu runner pe)
      - name: Install MinGW-w64 for Windows 32-bit (Linux)
        if: matrix.goos == 'windows' && matrix.goarch == '386' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686
      
      # Linux 32-bit ke liye multilib support
      - name: Install multilib for Linux 386
        if: matrix.goos == 'linux' && matrix.goarch == '386'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib
      
      # Linux ARM builds ke liye cross-compilation tools
      - name: Install cross-compilation tools for ARM (Linux)
        if: matrix.goos == 'linux' && (matrix.goarch == 'arm' || matrix.goarch == 'arm64')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
      
      # Windows 64-bit ke liye MinGW setup (Windows runner pe)
      - name: Setup MinGW for Windows 64-bit
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64' && matrix.os == 'windows-latest'
        run: |
          choco install mingw --no-progress
      
      # Build folder create karo (Cross-platform way)
      - name: Create build directory (Windows)
        if: runner.os == 'Windows'
        run: New-Item -ItemType Directory -Force -Path build
        shell: pwsh
      
      - name: Create build directory (Unix)
        if: runner.os != 'Windows'
        run: mkdir -p build
      
      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: go build -o build/${{ matrix.name }}
      
      # Upload built binary as artifact (temporary storage)
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/${{ matrix.name }}
          retention-days: 1

  # Separate job - sabhi builds complete hone ke baad chalega
  commit-binaries:
    needs: build  # Sabhi build jobs complete hone ka wait karega
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    # IMPORTANT: Is job ko bhi explicitly write permission do
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      # Create build directory
      - name: Create build directory
        run: mkdir -p build
      
      # Download all binaries - macOS
      - name: Download macOS ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: cmdo-macos-arm64
          path: build-temp/
        continue-on-error: false
      
      - name: Download macOS AMD64 binary
        uses: actions/download-artifact@v4
        with:
          name: cmdo-macos-amd64
          path: build-temp/
        continue-on-error: false
      
      # Download Windows binaries
      - name: Download Windows AMD64 binary
        uses: actions/download-artifact@v4
        with:
          name: cmdo-windows-amd64.exe
          path: build-temp/
        continue-on-error: false
      
      - name: Download Windows 386 binary
        uses: actions/download-artifact@v4
        with:
          name: cmdo-windows-386.exe
          path: build-temp/
        continue-on-error: false
      
      # Download Linux binaries
      - name: Download Linux AMD64 binary
        uses: actions/download-artifact@v4
        with:
          name: cmdo-linux-amd64
          path: build-temp/
        continue-on-error: false
      
      - name: Download Linux 386 binary
        uses: actions/download-artifact@v4
        with:
          name: cmdo-linux-386
          path: build-temp/
        continue-on-error: false
      
      - name: Download Linux ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: cmdo-linux-arm64
          path: build-temp/
        continue-on-error: false
      
      - name: Download Linux ARM binary
        uses: actions/download-artifact@v4
        with:
          name: cmdo-linux-arm
          path: build-temp/
        continue-on-error: false
      
      # Move files to build directory
      - name: Organize binaries
        run: |
          echo "Downloaded files:"
          find build-temp/ -type f
          
          # Copy all binaries to build folder
          find build-temp/ -type f -name "cmdo*" -exec cp {} build/ \;
          
          echo "Final build directory:"
          ls -lh build/
      
      # Commit aur push - proper way
      - name: Commit and push all binaries
        run: |
          # Git config
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Pehle latest changes pull karo (before any staging)
          git pull origin main
          
          # Ab files add karo
          git add build/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            echo "Committing changes..."
            git commit -m "Build: Update all binaries [skip ci]"
            
            # Push with retry logic (in case of race conditions)
            for i in {1..3}; do
              if git push origin main; then
                echo "Push successful!"
                exit 0
              else
                echo "Push failed, retrying... ($i/3)"
                git pull origin main --rebase
                sleep 2
              fi
            done
            
            echo "Failed to push after 3 attempts"
            exit 1
          fi