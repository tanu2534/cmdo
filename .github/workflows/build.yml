name: Build CMDO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M1/M2/M3/M4)
          - os: macos-latest
            goos: darwin
            goarch: arm64
            name: cmdo-macos-arm64
            cgo: 1
          
          # macOS Intel
          - os: macos-latest
            goos: darwin
            goarch: amd64
            name: cmdo-macos-amd64
            cgo: 1
          
          # Windows 64-bit
          - os: windows-latest
            goos: windows
            goarch: amd64
            name: cmdo-windows-amd64.exe
            cgo: 1
          
          # Windows 32-bit (Ubuntu se cross-compile)
          - os: ubuntu-latest
            goos: windows
            goarch: 386
            name: cmdo-windows-386.exe
            cgo: 1
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      # Windows 32-bit ke liye MinGW setup (Ubuntu runner pe)
      - name: Install MinGW-w64 for Windows 32-bit (Linux)
        if: matrix.goos == 'windows' && matrix.goarch == '386' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686
      
      # Windows 64-bit ke liye MinGW setup (Windows runner pe)
      - name: Setup MinGW for Windows 64-bit
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64' && matrix.os == 'windows-latest'
        run: |
          choco install mingw --no-progress
      
      # Build folder create karo (Cross-platform way)
      - name: Create build directory (Windows)
        if: runner.os == 'Windows'
        run: New-Item -ItemType Directory -Force -Path build
        shell: pwsh
      
      - name: Create build directory (Unix)
        if: runner.os != 'Windows'
        run: mkdir -p build
      
      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.goos == 'windows' && matrix.goarch == '386' && 'i686-w64-mingw32-gcc' || '' }}
        run: go build -o build/${{ matrix.name }}
      
      # Upload built binary as artifact (temporary storage)
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/${{ matrix.name }}
          retention-days: 1

  # Separate job - sabhi builds complete hone ke baad chalega
  commit-binaries:
    needs: build  # Sabhi build jobs complete hone ka wait karega
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history fetch karo for clean git operations
      
      # Create build directory
      - name: Create build directory
        run: mkdir -p build
      
      # Download all 4 binaries - ek ek karke with proper error handling
      - name: Download macOS ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: cmdo-macos-arm64
          path: build-temp/
        continue-on-error: false
      
      - name: Download macOS AMD64 binary
        uses: actions/download-artifact@v4
        with:
          name: cmdo-macos-amd64
          path: build-temp/
        continue-on-error: false
      
      - name: Download Windows AMD64 binary
        uses: actions/download-artifact@v4
        with:
          name: cmdo-windows-amd64.exe
          path: build-temp/
        continue-on-error: false
      
      - name: Download Windows 386 binary
        uses: actions/download-artifact@v4
        with:
          name: cmdo-windows-386.exe
          path: build-temp/
        continue-on-error: false
      
      # Move files to build directory (artifacts download with nested folder structure)
      - name: Organize binaries
        run: |
          # List kya download hua
          echo "Downloaded files:"
          find build-temp/ -type f
          
          # Sab files ko build/ mein move karo
          find build-temp/ -type f -name "cmdo*" -exec cp {} build/ \;
          
          # Verify
          echo "Final build directory:"
          ls -lh build/
      
      # Commit aur push - ek saath saari files
      - name: Commit and push all binaries
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Latest changes pull karo
          git pull origin main --rebase
          
          # Build folder add karo
          git add build/
          
          # Check if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Build: Update all binaries [skip ci]"
            git push origin main
          fi