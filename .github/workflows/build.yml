name: Build CMDO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M1/M2/M3)
          - os: macos-latest
            goos: darwin
            goarch: arm64
            name: cmdo-macos-arm64
            cgo: 1
          
          # macOS Intel
          - os: macos-latest
            goos: darwin
            goarch: amd64
            name: cmdo-macos-amd64
            cgo: 1
          
          # Windows 64-bit
          - os: windows-latest
            goos: windows
            goarch: amd64
            name: cmdo-windows-amd64.exe
            cgo: 1
          
          # Windows 32-bit (Ubuntu se cross-compile)
          - os: ubuntu-latest
            goos: windows
            goarch: 386
            name: cmdo-windows-386.exe
            cgo: 1
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      # Windows 32-bit ke liye MinGW setup (Ubuntu runner pe)
      - name: Install MinGW-w64 for Windows 32-bit (Linux)
        if: matrix.goos == 'windows' && matrix.goarch == '386' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686
      
      # Windows 64-bit ke liye MinGW setup (Windows runner pe)
      - name: Setup MinGW for Windows 64-bit
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64' && matrix.os == 'windows-latest'
        run: |
          choco install mingw --no-progress
      
      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.goos == 'windows' && matrix.goarch == '386' && 'i686-w64-mingw32-gcc' || '' }}
        run: go build -o ${{ matrix.name }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}